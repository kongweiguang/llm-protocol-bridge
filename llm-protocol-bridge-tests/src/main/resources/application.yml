# LLM Protocol Bridge Test Configuration
# Run: mvn spring-boot:run -pl llm-protocol-bridge-tests

server:
  port: 8080

llm:
  bridge:
    enabled: true

    server:
      auth-token: ${LLM_BRIDGE_TOKEN:local-token}
      ttfb-timeout: 30s
      request-timeout: 120s

    stream:
      enabled: true
      include-usage: true
      heartbeat-enabled: true
      heartbeat-interval: 15s

    compatibility:
      preserve-unknown-fields: true
      unsupported-media-policy: downgrade
      default-max-output-tokens: 4096
      expose-thinking: false
      ignore-invalid-thinking-signature: true

    # New-style configuration: providers / model-aliases / routes
    providers:
      openai-primary:
        kind: openai-responses-compatible
        endpoint:
          base-url: https://api.openai.com/v1
        authentication:
          type: bearer-token
          token: ${OPENAI_API_KEY:sk-placeholder}
        default-headers:
          user-agent: llm-protocol-bridge

      anthropic-primary:
        kind: anthropic-messages-compatible
        endpoint:
          base-url: https://api.anthropic.com
        authentication:
          type: x-api-key
          token: ${ANTHROPIC_API_KEY:sk-placeholder}
        default-headers:
          anthropic-version: "2023-06-01"

      glm-primary:
        kind: openai-chat-compatible
        endpoint:
          base-url: https://open.bigmodel.cn/api/paas/v4
        authentication:
          type: bearer-token
          token: ${GLM_API_KEY:placeholder}

      mimo-primary:
        kind: openai-chat-compatible
        endpoint:
          base-url: https://api.xiaomimimo.com/v1
        authentication:
          type: bearer-token
          token: ${XIAOMI_API_KEY:placeholder}
        request-defaults:
          ignore_invalid_history: true

    model-aliases:
      gpt-main:
        provider-ref: openai-primary
        upstream-model: gpt-4o

      claude-main:
        provider-ref: anthropic-primary
        upstream-model: claude-sonnet-4-6

      glm-chat:
        provider-ref: glm-primary
        upstream-model: glm-4.7

      mimo-chat:
        provider-ref: mimo-primary
        upstream-model: mimo-v2.5-pro

    routes:
      coding:
        strategy: failover
        candidates:
          - model-ref: gpt-main
          - model-ref: claude-main
          - model-ref: glm-chat
          - model-ref: mimo-chat
